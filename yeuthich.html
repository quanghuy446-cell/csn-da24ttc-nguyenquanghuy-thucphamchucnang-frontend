<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản Phẩm Yêu Thích - An Tâm Mart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="src/giaodien.css">
</head>
<body>
    <div class="sticky-top shadow-sm">
        <header class="header-main">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-lg-3 col-md-3">
                        <a href="index.html" class="logo-text">An Tâm Mart</a>
                    </div>
                    <div class="col-lg-4 col-md-4 search-wrapper">
                        <form class="d-flex" id="headerSearchForm">
                            <input class="form-control me-2" id="headerSearchInput" type="search" placeholder="Tìm tên sản phẩm, vitamin..." aria-label="Search" autocomplete="off">
                            <button class="btn btn-success px-3 text-nowrap" type="submit">Tìm</button>
                        </form>
                        <div class="search-suggestions" id="searchSuggestions"></div>
                    </div>
                    <div class="col-lg-5 col-md-5 d-flex align-items-center justify-content-end gap-2 flex-nowrap" id="authContainer"></div>
                </div>
            </div>
        </header>

        <nav class="nav-menu">
            <div class="container">
                <ul class="nav d-flex justify-content-between">
                    <li class="nav-item"><a class="nav-link" href="index.html">Trang Chủ</a></li>
                    <li class="nav-item"><a class="nav-link" href="gioithieu.html">Giới Thiệu</a></li>
                    <li class="nav-item"><a class="nav-link" href="sanpham.html">Sản Phẩm</a></li>
                    <li class="nav-item"><a class="nav-link" href="sanpham.html?cat=T%C4%83ng%20%C4%91%E1%BB%81%20kh%C3%A1ng%20v%C3%A0%20Mi%E1%BB%85n%20d%E1%BB%8Bch">Tăng đề kháng</a></li>
                    <li class="nav-item"><a class="nav-link" href="sanpham.html?cat=%C4%90%E1%BA%B9p%20da%2C%20T%C3%B3c%20v%C3%A0%20M%C3%B3ng">Đẹp da, Tóc, Móng</a></li>
                    <li class="nav-item"><a class="nav-link" href="sanpham.html?cat=X%C6%B0%C6%A1ng%20kh%E1%BB%9Bp%20v%C3%A0%20C%C6%A1%20b%E1%BA%AFp">Xương khớp</a></li>
                    <li class="nav-item"><a class="nav-link" href="sanpham.html?cat=M%E1%BA%B9%20b%E1%BA%A7u%20v%C3%A0%20Em%20b%C3%A9">Mẹ bầu và Em bé</a></li>
                    <li class="nav-item"><a class="nav-link" href="lienhe.html">Liên Hệ</a></li>
                </ul>
            </div>
        </nav>
    </div>

    <main class="container my-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index.html">Trang chủ</a></li>
                <li class="breadcrumb-item active" aria-current="page">Sản phẩm yêu thích</li>
            </ol>
        </nav>

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 border-bottom pb-2 mb-4">
            <h1 class="fs-3 fw-bold text-success m-0">Sản Phẩm Yêu Thích</h1>
            <div class="d-flex flex-wrap gap-2">
                <button type="button" id="btnAddAllFavToCart" class="btn btn-success btn-sm fw-semibold" style="display: none;" onclick="addAllFavoritesToCart()">Thêm tất cả vào giỏ</button>
                <button type="button" id="btnClearAllFav" class="btn btn-outline-danger btn-sm fw-semibold" style="display: none;" onclick="clearAllFavorites()">Xóa tất cả</button>
                <a href="sanpham.html" class="btn btn-outline-success btn-sm">Khám phá thêm sản phẩm</a>
            </div>
        </div>

        <div class="row g-3" id="favoritesGrid"></div>
    </main>

    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="src/dulieu-sanpham.js"></script>
    <script src="src/dungchung.js"></script>
    <script>
        function renderFavorites() {
            const grid = document.getElementById('favoritesGrid');
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';

            if (!isLoggedIn) {
                grid.innerHTML = `
                    <div class="col-12">
                        <div class="bg-white p-5 rounded border text-center">
                            <h5 class="text-dark fw-bold mb-2">Vui lòng đăng nhập để xem danh sách yêu thích</h5>
                            <p class="small text-muted mb-3">Danh sách sản phẩm yêu thích được lưu riêng biệt theo từng tài khoản khách hàng.</p>
                            <a href="dangnhap.html" class="btn btn-success btn-sm fw-bold px-4">Đăng nhập ngay</a>
                        </div>
                    </div>
                `;
                return;
            }

            const inventory = initInventoryCommon();
            const favIds = getFavorites();
            const favItems = inventory.filter(p => favIds.includes(p.id));
            const btnAddAll = document.getElementById('btnAddAllFavToCart');
            const btnClearAll = document.getElementById('btnClearAllFav');
            if (btnAddAll) btnAddAll.style.display = favItems.length > 0 ? 'inline-block' : 'none';
            if (btnClearAll) btnClearAll.style.display = favItems.length > 0 ? 'inline-block' : 'none';

            grid.innerHTML = '';
            if (favItems.length === 0) {
                grid.innerHTML = `
                    <div class="col-12">
                        <div class="bg-white p-5 rounded border text-center">
                            <h5 class="text-muted mb-2">Danh sách yêu thích của bạn đang trống</h5>
                            <p class="small text-muted mb-3">Hãy rê chuột vào sản phẩm bạn thích và nhấn biểu tượng trái tim để lưu lại nhé.</p>
                            <a href="sanpham.html" class="btn btn-success btn-sm fw-bold">Xem sản phẩm ngay</a>
                        </div>
                    </div>
                `;
                return;
            }

            grid.innerHTML = favItems.map(item => renderProductCardHtml(item, { colClass: 'col-md-3 col-sm-6', onFavCb: 'renderFavorites' })).join('');
        }

        function addAllFavoritesToCart() {
            const inventory = initInventoryCommon();
            const favIds = getFavorites();
            let addedCount = 0;
            favIds.forEach(id => {
                const prod = inventory.find(p => p.id === id);
                if (prod && (parseInt(prod.stock) || 0) > 0) {
                    if (quickAddToCartCommon(id)) addedCount++;
                }
            });
            if (addedCount > 0) {
                showSiteToast(`Đã thêm ${addedCount} sản phẩm yêu thích vào giỏ hàng.`);
            } else {
                showSiteToast('Không có sản phẩm còn hàng nào để thêm vào giỏ.', true);
            }
        }

        function clearAllFavorites() {
            saveFavorites([]);
            renderFavorites();
            renderCommonAuthHeader();
            showSiteToast('Đã xóa toàn bộ danh sách yêu thích.');
        }

        document.addEventListener('DOMContentLoaded', renderFavorites);
    </script>
</body>
</html>
